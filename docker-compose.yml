services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    env_file: .env
    restart: unless-stopped
    volumes:
      - ppm_data:/data
    environment:
      DB_PATH: /data/ppm.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
  scheduler:
    build: .
    command: python -m app.scheduler
    env_file: .env
    restart: unless-stopped
    volumes:
      - ppm_data:/data
    environment:
      DB_PATH: /data/ppm.sqlite3
    depends_on:
      - web
volumes:
  ppm_data:
